<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Abraj Bay PTW System</title>
  <style>
    /* Full screen reset */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #f4f6f9; }
    
    /* Loading Spinner Overlay */
    #loader {
      position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      background: #fff; color: #333; font-family: sans-serif; transition: opacity 0.3s;
    }
    .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #1f4e79; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* The Frame */
    iframe { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
      /* CRITICAL ATTRIBUTES BELOW */
      allowtransparency="true" 
      allowfullscreen="true"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <span>Loading Secure Portal...</span>
</div>

<!-- Replace SRC with your actual link -->
<iframe 
  id="appFrame"
  src="https://script.google.com/macros/s/AKfycbyOUNACwPt3u6EEe5R3Lvh6GmvDZZ4GUp5gZ_Wit8ltR-S0XEZbKg4Vo5bLpIBlpdKyug/exec"
  onload="hideLoader()"
></iframe>

<script>
function hideLoader() {
  document.getElementById('loader').style.opacity = '0';
  setTimeout(() => document.getElementById('loader').remove(), 300);
}

// Fallback: If it takes too long, assume blocked and redirect directly
setTimeout(() => {
  const loader = document.getElementById('loader');
  if(loader && loader.style.opacity !== '0') {
     alert("Security restriction detected. Redirecting to direct portal...");
     window.location.href = "https://script.google.com/macros/s/AKfycbyOUNACwPt3u6EEe5R3Lvh6GmvDZZ4GUp5gZ_Wit8ltR-S0XEZbKg4Vo5bLpIBlpdKyug/exec";
  }
}, 5000); // Wait 5 seconds before giving up
</script>

</body>
</html>
